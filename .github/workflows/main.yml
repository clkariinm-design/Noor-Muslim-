name: Build Noor Muslim APK

on:
  push:
    branches:
      - main
      - feature/adhan-controls
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify bundled Quran corpus
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          path = Path("app/src/main/assets/quran-uthmani-1.1.txt")
          raw = path.read_bytes()
          expected_sha256 = "ac0724796cbbda0f4801470fbbd11d0f3c5802067bae0493466d0128b0c667af"
          actual_sha256 = hashlib.sha256(raw).hexdigest()
          assert actual_sha256 == expected_sha256, f"Tanzil source checksum mismatch: {actual_sha256}"

          lines = [line for line in raw.decode("utf-8").splitlines()
                   if line.strip() and not line.startswith("#")]
          source = Path("app/src/main/java/com/example/data/repository/QuranRepository.kt").read_text(encoding="utf-8")
          counts = [int(value) for value in re.findall(
              r'Surah\(\d+,\s*".*?",\s*".*?",\s*".*?",\s*(\d+),', source
          )]
          assert len(counts) == 114, f"Expected 114 surah records, got {len(counts)}"
          assert sum(counts) == 6236, f"Surah index totals {sum(counts)} ayahs"
          assert len(lines) == 6236, f"Expected 6236 ayahs, got {len(lines)}"
          print("Verified Tanzil SHA-256, 114 surahs and all 6,236 ayahs")
          PY

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Muslim-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
