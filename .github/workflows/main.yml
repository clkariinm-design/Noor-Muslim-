name: Build Noor Muslim APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify bundled Quran corpus
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/assets/quran-uthmani-1.1.txt")
          lines = [line for line in path.read_text(encoding="utf-8").splitlines()
                   if line.strip() and not line.startswith("#")]
          assert len(lines) == 6236, f"Expected 6236 ayahs, got {len(lines)}"
          print("Verified bundled Tanzil text: 6,236 ayahs")
          PY

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Muslim-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
