name: Build Noor Muslim APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify bundled Quran corpus
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          asset_path = Path("app/src/main/assets/quran_uthmani.json")
          with asset_path.open(encoding="utf-8") as asset_file:
              corpus = json.load(asset_file)

          surahs = corpus.get("surahs")
          assert isinstance(surahs, list), "Quran asset must contain a 'surahs' array"
          assert len(surahs) == 114, f"Expected 114 surahs, got {len(surahs)}"

          source = Path("app/src/main/java/com/example/data/repository/QuranRepository.kt").read_text(encoding="utf-8")
          expected_counts = [int(value) for value in re.findall(
              r'Surah\(\d+,\s*".*?",\s*".*?",\s*".*?",\s*(\d+),', source
          )]
          assert len(expected_counts) == 114, f"Expected 114 surah index records, got {len(expected_counts)}"

          total_ayahs = 0
          for index, (surah, expected_count) in enumerate(zip(surahs, expected_counts), start=1):
              assert surah.get("number") == index, f"Unexpected surah number at position {index}"
              ayahs = surah.get("ayahs")
              assert isinstance(ayahs, list), f"Surah {index} is missing its ayah list"
              canonical_ayahs = [ayah for ayah in ayahs if int(ayah.get("number", -1)) > 0]
              assert len(canonical_ayahs) == expected_count, (
                  f"Surah {index}: expected {expected_count} ayahs, got {len(canonical_ayahs)}"
              )
              assert all(isinstance(ayah.get("text"), str) and ayah["text"].strip()
                         for ayah in canonical_ayahs), f"Surah {index} contains empty ayah text"
              total_ayahs += len(canonical_ayahs)

          assert total_ayahs == 6236, f"Expected 6,236 canonical ayahs, got {total_ayahs}"
          print("Verified bundled Quran JSON: 114 surahs and all 6,236 canonical ayahs")
          PY

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Muslim-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
